# Test workflow: runs on every push and pull request, and is reused by the
# release workflow (which passes the release commit as `ref`). Every step
# always runs: a missing package.json or .dafny-version is a failure, never
# a reason to skip checks.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Commit to test. The release workflow passes the release commit."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  spec:
    name: Spec and plan checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Error codes defined, JSON examples valid, fixtures and codes match the spec
        run: python3 scripts/check_spec.py docs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every Mermaid diagram renders
        run: |
          python3 scripts/check_spec.py mermaid "$RUNNER_TEMP/mmd"
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          for f in "$RUNNER_TEMP"/mmd/*.mmd; do
            echo "rendering $(basename "$f")"
            npx -y @mermaid-js/mermaid-cli@11 -q -p "$RUNNER_TEMP/puppeteer.json" -i "$f" -o "${f%.mmd}.svg"
          done

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint and formatting
        run: npm run lint
      - name: Build, then every test
        run: npm test
      - name: Every error code is named in a test (reference check)
        run: python3 scripts/check_spec.py coverage
      - name: Every closed milestone's acceptance tests pass, none skipped
        run: python3 scripts/check_spec.py milestones

  package:
    name: Packaging (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: install.sh passes shellcheck (POSIX sh)
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - name: Build (the bundle and binary are checked against the npm build)
        run: npm run build
      - name: Bundle, standalone binary and installer tests (SPEC §5.5, §12.3)
        run: npx vitest run tests/package

  # Only the release used to build the image, so a broken Dockerfile first failed a release.
  # amd64 is enough to catch that; the release still builds amd64 and arm64.
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build the image
        run: docker build -t skope-ci .
      - name: The image runs skope
        run: |
          docker run --rm skope-ci --version
          docker run --rm -v "$PWD/fixtures:/fixtures:ro" skope-ci /fixtures/disk-full/SKILL.md --lint

  dafny:
    name: Dafny proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Pinned Dafny version
        id: dafny
        run: echo "version=$(tr -d '[:space:]' < .dafny-version)" >> "$GITHUB_OUTPUT"
      # Dafny spells an axiom several ways ({:axiom}, @Axiom, extra spaces),
      # so any mention of one fails. {:verify false} and {:only} make Dafny
      # itself fail, but they're checked here too.
      - name: No proof shortcuts (SPEC §5.3)
        run: |
          if grep -rniE '\bassume\b|axiom|\{:\s*verify\s+false|@verify|\{:\s*only' --include='*.dfy' .; then
            echo "Dafny code must not assume, declare an axiom, or skip verification."; exit 1
          fi
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: ${{ steps.dafny.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify every tracked Dafny file, including tests
        run: dafny verify $(git ls-files '*.dfy')
      - name: Rebuild the JavaScript from the core
        run: node scripts/build-core.mjs
      - name: Committed JavaScript matches the proofs
        run: |
          if ! git diff --exit-code core/generated; then
            echo "core/generated is stale: run 'npm run core' and commit the result."; exit 1
          fi
