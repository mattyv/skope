# Release workflow: push a tag like v1.0.0, or run it by hand on an existing
# tag. The first job resolves the tag to one commit, and every later job
# (tests, package, clean installs, container) uses that exact commit, so the
# thing tested is the thing shipped. Then it publishes the GitHub release,
# the container image and, if an NPM_TOKEN secret is set, the npm package.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: read

env:
  # The standalone binaries embed this exact Node build (SPEC §5.5, PLAN.md
  # §8: "from a pinned Node version"), independent of whichever Node the
  # runner's own tool cache happens to have.
  PINNED_NODE_VERSION: "20.18.1"

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The tag comes in through env, never pasted into the script: a tag
      # name can contain shell syntax.
      - name: Tag to commit, and tag matches package version
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          sha=$(git rev-parse --verify "refs/tags/$tag^{commit}") || { echo "No tag $tag."; exit 1; }
          git checkout -q "$sha"
          if [ ! -f Dockerfile ]; then echo "No Dockerfile at $tag, so no container image to publish (PLAN.md §8)."; exit 1; fi
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then echo "Tag $tag doesn't match package.json version $pkg."; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${pkg#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag at $sha."

  test:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  package:
    name: Build package
    needs: [resolve, test]
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Pack
        id: pack
        run: |
          file=$(npm pack --silent | tail -1)
          echo "tarball=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}

  install-check:
    name: Clean install (${{ matrix.os }})
    needs: [resolve, package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist-pkg
      - name: Install into an empty directory with only Node
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/dist-pkg/$TARBALL"
          out=$(npx skope --version)
          echo "$out"
          case "$out" in "skope $VERSION (build identity "*) ;; *) echo "expected skope $VERSION"; exit 1 ;; esac
      # Every fixture in fixtures/ ships with this release. Each scenario directory
      # holds answers.yaml, commands.yaml and expected-exit, because paged
      # (10) and handoff (20) are correct results, not failures.
      - name: Every released scenario gives its expected exit code
        run: |
          cd "$RUNNER_TEMP/clean"
          shopt -s nullglob
          status=0
          for skill in "$GITHUB_WORKSPACE"/fixtures/*/SKILL.md; do
            dir=$(dirname "$skill")
            npx skope "$skill" --lint || { echo "lint failed: $skill"; status=1; }
            scenarios=("$dir"/fakes/*/)
            if [ ${#scenarios[@]} -eq 0 ]; then echo "$(basename "$dir") has no fake scenarios"; status=1; fi
            for scenario in "${scenarios[@]}"; do
              want=$(cat "$scenario/expected-exit")
              set +e
              npx skope "$skill" --dry-run --fake "$scenario/answers.yaml" --fake-exec "$scenario/commands.yaml" > /dev/null
              got=$?
              set -e
              if [ "$got" != "$want" ]; then
                echo "$(basename "$dir")/$(basename "$scenario"): exit $got, expected $want"; status=1
              fi
            done
          done
          exit $status

  binaries:
    name: Standalone binary (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [resolve, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Download the pinned Node build to embed
        id: pinned
        shell: bash
        run: |
          file="node-v$PINNED_NODE_VERSION-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v$PINNED_NODE_VERSION/$file"
          tar xf "$file"
          echo "node=$PWD/node-v$PINNED_NODE_VERSION-${{ matrix.platform }}-${{ matrix.arch }}/bin/node" >> "$GITHUB_OUTPUT"
      - name: Bundle and build the standalone binary (SPEC §5.5)
        run: |
          node scripts/package/sea.mjs \
            --node "${{ steps.pinned.outputs.node }}" \
            --outfile "dist-bin/skope-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-bin/*

  checksums:
    name: SHA256SUMS
    needs: [resolve, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist-bin
          merge-multiple: true
      - run: cd dist-bin && sha256sum skope-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist-bin/SHA256SUMS

  binary-install-check:
    name: Install binary (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [resolve, binaries, checksums]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/download/v${{ needs.resolve.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: release/download/v${{ needs.resolve.outputs.version }}
      # A local file server standing in for the GitHub release, laid out the
      # way install.sh expects under SKOPE_DOWNLOAD_URL: <version>/<file>.
      - name: Serve the release directory
        run: |
          chmod +x "release/download/v${{ needs.resolve.outputs.version }}"/skope-*
          python3 -m http.server 8099 --directory release &
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.5; done
      - name: Install with no Node on PATH, on a clean debian:stable-slim (Linux)
        if: matrix.platform == 'linux'
        run: |
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            -e SKOPE_DOWNLOAD_URL=http://127.0.0.1:8099 \
            -e SKOPE_VERSION=${{ needs.resolve.outputs.version }} \
            -e SKOPE_INSTALL_DIR=/work/installed \
            debian:stable-slim \
            sh -c 'apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && sh install.sh'
          echo "$PWD/installed" >> "$GITHUB_PATH"
      - name: Install with node removed from PATH (macOS)
        if: matrix.platform == 'darwin'
        env:
          PATH: /usr/bin:/bin
          SKOPE_DOWNLOAD_URL: http://127.0.0.1:8099
          SKOPE_VERSION: ${{ needs.resolve.outputs.version }}
          SKOPE_INSTALL_DIR: installed
        run: |
          sh install.sh
          echo "$PWD/installed" >> "$GITHUB_PATH"
      # Same checks as the npm package's clean install (install-check above):
      # --version, then every released fixture's fake scenarios.
      - name: skope --version and every fixture's fake scenarios
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          out=$(skope --version)
          echo "$out"
          case "$out" in "skope $VERSION (build identity "*) ;; *) echo "expected skope $VERSION"; exit 1 ;; esac
          shopt -s nullglob
          status=0
          for skill in fixtures/*/SKILL.md; do
            dir=$(dirname "$skill")
            skope "$skill" --lint || { echo "lint failed: $skill"; status=1; }
            scenarios=("$dir"/fakes/*/)
            for scenario in "${scenarios[@]}"; do
              want=$(cat "$scenario/expected-exit")
              set +e
              skope "$skill" --dry-run --fake "$scenario/answers.yaml" --fake-exec "$scenario/commands.yaml" > /dev/null
              got=$?
              set -e
              if [ "$got" != "$want" ]; then
                echo "$(basename "$dir")/$(basename "$scenario"): exit $got, expected $want"; status=1
              fi
            done
          done
          exit $status
        shell: bash

  # Publishing waits for everything, including the container, so a failed
  # step can't leave a half-published release (an npm publish can't be undone).
  github-release:
    name: GitHub release
    needs: [resolve, package, install-check, binary-install-check, checksums, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist-pkg
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist-bin
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist-bin
      - name: Create release with the binaries, SHA256SUMS, install.sh and the package attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release create "$TAG" dist-pkg/* dist-bin/* install.sh --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  container:
    name: Container image
    needs: [resolve, package, install-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  npm-publish:
    name: Publish to npm
    needs: [package, install-check, container, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist-pkg
      - name: Publish, if an NPM_TOKEN secret is set
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret; skipping npm publish."; exit 0
          fi
          npm publish "dist-pkg/$TARBALL" --provenance --access public
